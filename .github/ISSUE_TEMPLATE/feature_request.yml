name: Feature request
description: Suggest a change to skill browsing.
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe what you are trying to do and where Skill Shelf falls short.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested change
      description: Describe the behavior you would like. Skill Shelf is a read-only browser for installed skills.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or additional context
      description: Include workarounds, examples, or mockups. Remove sensitive information before posting.
